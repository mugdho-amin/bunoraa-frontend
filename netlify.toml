# Netlify configuration for Bunoraa frontend

[build]
  base = "./"
  command = "npm run build"

[build.environment]
  SECRETS_SCAN_OMIT_KEYS = "NEXT_PUBLIC_CLOUDFLARE_BEACON_TOKEN,NEXT_PUBLIC_CLOUDFLARE_BEACON_ENABLED,NEXT_PUBLIC_VAPID_PUBLIC_KEY,NEXT_PUBLIC_SITE_URL,NEXT_PUBLIC_API_BASE_URL,NEXT_INTERNAL_API_BASE_URL,NEXT_PUBLIC_API_USE_PROXY,NEXT_PUBLIC_MEDIA_BASE_URL,NEXT_PUBLIC_WS_BASE_URL,VITE_API_URL"
  SECRETS_SCAN_OMIT_PATHS = ".env*,.netlify"

[[plugins]]
  package = "@netlify/plugin-nextjs"

# Proxy backend routes to Django API server
[[redirects]]
  from = "/admin/*"
  to = "https://musaddikul-bunoraa-backend.hf.space/admin/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/health/*"
  to = "https://musaddikul-bunoraa-backend.hf.space/health/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/status"
  to = "https://musaddikul-bunoraa-backend.hf.space/status"
  status = 200
  force = true

[[redirects]]
  from = "/oauth/*"
  to = "https://musaddikul-bunoraa-backend.hf.space/oauth/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/email/*"
  to = "https://musaddikul-bunoraa-backend.hf.space/email/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/api/schema/*"
  to = "https://musaddikul-bunoraa-backend.hf.space/api/schema/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/sitemap.xml"
  to = "https://musaddikul-bunoraa-backend.hf.space/sitemap.xml"
  status = 200
  force = true

[[redirects]]
  from = "/sitemap-:section.xml"
  to = "https://musaddikul-bunoraa-backend.hf.space/sitemap-:section.xml"
  status = 200
  force = true

# Cache static assets aggressively
[[headers]]
  for = "/_next/static/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/static/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Security headers for all routes
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Strict-Transport-Security = "max-age=63072000; includeSubDomains; preload"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), payment=(self), browsing-topics=()"
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' https://accounts.google.com https://www.googletagmanager.com https://cdn.cloudflare.com; style-src 'self' 'unsafe-inline' https://accounts.google.com; img-src 'self' blob: data: https://media.bunoraa.com https://*.bunoraa.com; font-src 'self' data:; connect-src 'self' https: wss://musaddikul-bunoraa-backend.hf.space https://accounts.google.com https://www.google-analytics.com; frame-src 'self' https://accounts.google.com; object-src 'none'; base-uri 'self'; form-action 'self'"
